[package]
name = "mc-launcher"
version = "0.1.0"
edition = "2021"

[dependencies]
tauri = "2"
tauri-plugin-updater = "2"
tauri-plugin-shell = "2"
tauri-plugin-log = "2"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.11", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
zip = "0.6"
thiserror = "1"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
flate2 = "1"
tar = "0.4"
urlencoding = "2"

[dependencies.tauri-plugin-fs]
version = "2"

[build-dependencies]
tauri-cli = "2"

[profile.release]
lto = true
opt-level = 3
