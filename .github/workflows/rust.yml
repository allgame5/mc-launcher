name: Build Launcher

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies & typecheck
        run: |
          npm ci
          npx tsc --noEmit
          npm run build

      - name: Check & build Rust backend
        working-directory: src-tauri
        run: |
          cargo check
          cargo build --release

      - name: Upload Windows executable
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mc-launcher-windows
          path: |
            src-tauri/target/release/mc-launcher.exe
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: warn
